name: Deploy Infrastructure
on:
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # -------------------------------------------------------
      # Funcion reutilizable: elimina stacks en ROLLBACK_COMPLETE
      # -------------------------------------------------------
      - name: Cleanup stacks en ROLLBACK_COMPLETE
        run: |
          cleanup_stack() {
            STACK_NAME=$1
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null || echo "DOES_NOT_EXIST")
            echo "Stack $STACK_NAME -> estado: $STATUS"
            if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
              echo "Eliminando $STACK_NAME en ROLLBACK_COMPLETE..."
              aws cloudformation delete-stack --stack-name "$STACK_NAME"
              aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
              echo "$STACK_NAME eliminado correctamente."
            fi
          }
          cleanup_stack "SecurityGroups-JordyPrada"
          cleanup_stack "EC2-JordyPrada"
          cleanup_stack "ALB-ASG-JordyPrada"
          cleanup_stack "Automation-JordyPrada"

      # -------------------------------------------------------
      - name: Deploy Security Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/security.yml \
            --stack-name SecurityGroups-JordyPrada \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Deploy EC2 Stack
        run: |
          OUTPUT=$(aws cloudformation deploy \
            --template-file cloudformation/ec2.yml \
            --stack-name EC2-JordyPrada \
            --parameter-overrides SubnetId=subnet-014686d5696588e49 \
            --no-fail-on-empty-changeset 2>&1) || {
            echo "$OUTPUT"
            echo "=== Buscando eventos del stack ==="
            aws cloudformation describe-stack-events \
              --stack-name EC2-JordyPrada \
              --query "StackEvents[?contains(['CREATE_FAILED','UPDATE_FAILED'], ResourceStatus)].[LogicalResourceId, ResourceStatus, ResourceStatusReason]" \
              --output table 2>/dev/null || echo "Stack eliminado por rollback. Ver OUTPUT arriba."
            exit 1
          }

      - name: Deploy ALB-ASG Stack
        run: |
          OUTPUT=$(aws cloudformation deploy \
            --template-file cloudformation/alb-asg.yml \
            --stack-name ALB-ASG-JordyPrada \
            --parameter-overrides VpcId=vpc-0551a786fff021d6f SubnetIds=subnet-014686d5696588e49 \
            --no-fail-on-empty-changeset 2>&1) || {
            echo "$OUTPUT"
            echo "=== Buscando eventos del stack ==="
            aws cloudformation describe-stack-events \
              --stack-name ALB-ASG-JordyPrada \
              --query "StackEvents[?contains(['CREATE_FAILED','UPDATE_FAILED'], ResourceStatus)].[LogicalResourceId, ResourceStatus, ResourceStatusReason]" \
              --output table 2>/dev/null || echo "Stack eliminado por rollback. Ver OUTPUT arriba."
            exit 1
          }

      - name: Deploy Automation Stack
        run: |
          OUTPUT=$(aws cloudformation deploy \
            --template-file cloudformation/automation.yml \
            --stack-name Automation-JordyPrada \
            --no-fail-on-empty-changeset 2>&1) || {
            echo "$OUTPUT"
            echo "=== Buscando eventos del stack ==="
            aws cloudformation describe-stack-events \
              --stack-name Automation-JordyPrada \
              --query "StackEvents[?contains(['CREATE_FAILED','UPDATE_FAILED'], ResourceStatus)].[LogicalResourceId, ResourceStatus, ResourceStatusReason]" \
              --output table 2>/dev/null || echo "Stack eliminado por rollback. Ver OUTPUT arriba."
            exit 1
          }
