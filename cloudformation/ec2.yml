AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 Estatica - JordyPrada

Parameters:
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet donde se desplegara la instancia EC2

Resources:

  EC2JordyPrada:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: t3.micro
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !ImportValue SGInstanciaId
      Tags:
        - Key: Name
          Value: EC2-JordyPrada
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo '<h1>Hola desde Ocana, Norte de Santander</h1>' > /var/www/html/index.html

  ElasticIPJordyPrada:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref EC2JordyPrada

Outputs:
  PublicIP:
    Value: !Ref ElasticIPJordyPrada
    Description: IP publica estatica de la instancia
  InstanceId:
    Value: !Ref EC2JordyPrada
