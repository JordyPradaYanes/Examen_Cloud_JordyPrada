AWSTemplateFormatVersion: '2010-09-09'
Description: Security Groups - JordyPrada

Resources:

  SGInstanciaJordyPrada:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG para instancia EC2 publica
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  SGAlbJordyPrada:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG para Application Load Balancer
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

Outputs:
  SGInstanciaId:
    Value: !Ref SGInstanciaJordyPrada
    Export:
      Name: SGInstanciaId
  SGAlbId:
    Value: !Ref SGAlbJordyPrada
    Export:
      Name: SGAlbId